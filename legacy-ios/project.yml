name: RadarMoto
options:
  bundleIdPrefix: com.aitorgaillard
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug

targets:
  RadarMoto:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RadarMoto
    info:
      path: RadarMoto/Info.plist
      properties:
        CFBundleDisplayName: RadarMoto
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSLocationAlwaysAndWhenInUseUsageDescription: "RadarMoto necesita tu ubicación en segundo plano para detectar radares mientras conduces."
        NSLocationAlwaysUsageDescription: "RadarMoto necesita tu ubicación en segundo plano para detectar radares mientras conduces."
        NSLocationWhenInUseUsageDescription: "RadarMoto usa tu ubicación para detectar radares cercanos."
        UIBackgroundModes:
          - location
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aitorgaillard.radarmoto
        SWIFT_VERSION: "5.10"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: ""
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"
